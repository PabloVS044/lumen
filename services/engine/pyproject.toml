[project]
name = "lumen-engine"
version = "0.1.0"
description = "LUMEN Engine: horizon masks, SPICE ephemerides, visibility and metrics for lunar landing sites."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Contratos: código generado desde proto/ en gen/ (ADR-0012)
    "connect-python>=0.9,<0.10",
    "protobuf>=6.31",
    "protovalidate>=1.2,<2",
    "starlette>=0.46",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
# Ciencia: SPICE + interpolación. Owner: Efemérides/Ciencia
science = [
    "spiceypy>=6.0",
    "scipy>=1.14",
    "numba>=0.60",
]
# Geo: lectura de DEM COG y proyecciones. Owner: Geo/Datos
geo = [
    "rasterio>=1.4",
    "pyproj>=3.7",
]
# Persistencia y jobs. Owner: Backend/Infra
infra = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "httpx2>=2.16",
    "types-protobuf>=6.30",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# gen/lumen y gen/buf son código generado (pnpm proto:gen en la raíz); se instalan como `lumen` y `buf`.
packages = ["lumen_engine", "gen/lumen", "gen/buf"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "gen"
explicit_package_bases = true
exclude = ["^gen/"]

[[tool.mypy.overrides]]
module = ["lumen.*", "buf.*", "protovalidate.*", "celpy.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test que necesita red (excluido en CI)",
    "slow: test lento (benchmarks, horizonte completo)",
    "requires_kernels: necesita los kernels SPICE (se salta en local si faltan; falla en CI)",
]
