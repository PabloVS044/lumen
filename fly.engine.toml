# Motor LUMEN en Fly.io. Despliegue desde la raíz del repo:  flyctl deploy -c fly.engine.toml
# Pasos y secretos: docs/deploy.md. Owner: R1.
app = "lumen-engine"          # debe ser único en Fly: cámbialo si `flyctl apps create` lo rechaza
primary_region = "iad"        # Ashburn: cerca de la región por defecto de Vercel (iad1). Ajustable

[build]
  dockerfile = "infra/fly/Dockerfile"

[env]
  STORE = "memory"            # "postgres" solo si hay DATABASE_URL (secreto)
  WARMUP = "1"                # precalcula el horizonte de los sitios del catálogo al arrancar
  MAX_RANGE_DAYS = "730"

[mounts]
  source = "lumen_data"       # volumen creado con `flyctl volumes create`
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"  # sin paradas: un arranque en frío recompila numba y vacía las cachés
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"              # sin medir aún: si hay OOM, `flyctl scale memory 4096`
