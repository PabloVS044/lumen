# Web LUMEN (Next.js + BFF /api/engine) en Fly.io. Despliegue desde la raíz del repo:
#   flyctl deploy -c fly.web.toml \
#     --build-arg NEXT_PUBLIC_CESIUM_ION_TOKEN=<token> --build-arg NEXT_PUBLIC_CESIUM_MOON_ASSET_ID=<id>
# Los NEXT_PUBLIC_* se incrustan en build: el token NO se versiona (valores de apps/web/.env). Pasos: docs/deploy.md.
app = "lumen-web"             # debe ser único en Fly: cámbialo si `flyctl apps create` lo rechaza
primary_region = "iad"

[build]
  dockerfile = "infra/fly/Dockerfile.web"

  [build.args]
    NEXT_PUBLIC_ENGINE_MOCK = "0"
    # NEXT_PUBLIC_CESIUM_ION_TOKEN y NEXT_PUBLIC_CESIUM_MOON_ASSET_ID: solo por --build-arg (no versionar el token)

[env]
  ENGINE_URL = "http://lumen-engine.internal:8000"   # red privada de Fly; ENGINE_SHARED_SECRET va como secreto

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
