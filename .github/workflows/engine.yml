name: engine

on:
  pull_request:
    paths:
      [
        "services/engine/**",
        "proto/**",
        "data/catalog/**",
        "data/scripts/download_kernels.sh",
        ".github/workflows/engine.yml",
      ]
  push:
    branches: [main]

defaults:
  run:
    working-directory: services/engine

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Extras science/geo/infra (spiceypy, numba, rasterio...): los tests de ciencia los necesitan
      - run: uv sync --locked --all-extras
      # Kernels SPICE (~33 MB), cacheados por el hash del script que fija versiones y SHA-256
      - uses: actions/cache@v4
        with:
          path: services/engine/kernels
          key: spice-kernels-${{ hashFiles('data/scripts/download_kernels.sh') }}
      - run: bash ../../data/scripts/download_kernels.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy lumen_engine tests
      # En CI los tests que requieren kernels nunca se saltan
      - run: uv run pytest -m "not network"
        env:
          LUMEN_REQUIRE_KERNELS: "1"
          # Con CI definido, los tests de integración fallan (no se saltan) si Postgres no responde
          CI: "1"
          DATABASE_URL: postgresql://lumen:lumen@localhost:5432/lumen
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumen-engine:ci services/engine
      # La imagen debe arrancar de verdad (una vez falló al importar la configuración en /app)
      - run: docker run --rm lumen-engine:ci uv run --no-sync python -c "from lumen_engine.main import app"
