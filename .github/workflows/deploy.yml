name: deploy

# Despliega a Fly.io cuando CI pasa en `main`: solo la app cuyo código cambió en ese merge.
# Necesita secretos del repositorio (los crea un admin; ver docs/deploy.md, sección "Despliegue automático").
on:
  workflow_run:
    workflows: [engine, web]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "App a desplegar"
        type: choice
        options: [engine, web]
        required: true

jobs:
  engine:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.app == 'engine') ||
      (github.event.workflow_run.name == 'engine' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    concurrency: { group: deploy-engine, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: changes
        # En dispatch siempre se despliega; en un merge, solo si tocó el motor o su imagen/config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(services/engine/|data/catalog/|infra/fly/Dockerfile$|fly\.engine\.toml$|\.dockerignore$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Sin cambios del motor: no se despliega."
          fi
      - if: steps.changes.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.changes.outputs.deploy == 'true'
        run: flyctl deploy -c fly.engine.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE }}

  web:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.app == 'web') ||
      (github.event.workflow_run.name == 'web' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    concurrency: { group: deploy-web, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/web/|packages/sdk/|proto/|infra/fly/Dockerfile\.web$|fly\.web\.toml$|\.dockerignore$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Sin cambios de la web: no se despliega."
          fi
      - if: steps.changes.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.changes.outputs.deploy == 'true'
        # NEXT_PUBLIC_* se incrustan en el build: el token de Cesium viaja como build-arg (es público por diseño)
        run: >-
          flyctl deploy -c fly.web.toml --remote-only
          --build-arg NEXT_PUBLIC_CESIUM_ION_TOKEN="${{ secrets.NEXT_PUBLIC_CESIUM_ION_TOKEN }}"
          --build-arg NEXT_PUBLIC_CESIUM_MOON_ASSET_ID="${{ secrets.NEXT_PUBLIC_CESIUM_MOON_ASSET_ID }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
