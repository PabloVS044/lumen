name: web

on:
  pull_request:
    paths:
      [
        "apps/web/**",
        "packages/sdk/**",
        "proto/**",
        "package.json",
        "pnpm-lock.yaml",
        ".github/workflows/web.yml",
      ]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
