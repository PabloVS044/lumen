# Desarrollo local (sección 15.1). Owner: R1.
# Solo servicios de soporte:  docker compose -f infra/docker-compose.yml up -d db redis
# Motor en contenedor:        docker compose -f infra/docker-compose.yml up --build engine
services:
  engine:
    build: ../services/engine
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://lumen:lumen@db:5432/lumen
      REDIS_URL: redis://redis:6379/0
      DEM_BASE_URL: /data/dem
      KERNELS_DIR: /app/kernels
      CATALOG_PATH: /catalog/sites.yaml
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ../data/local:/data
      - ../data/catalog:/catalog:ro
      - ../services/engine/kernels:/app/kernels:ro
    depends_on: [db, redis]

  worker:
    build: ../services/engine
    command: ["uv", "run", "--no-sync", "arq", "lumen_engine.jobs.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql://lumen:lumen@db:5432/lumen
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    profiles: ["jobs"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
